<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-blue-800 to-cyan-600 px-4">

    <div class="w-full max-w-md backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl shadow-2xl p-10">

        <h2 class="text-4xl font-bold text-center text-white mb-2">
            Welcome Back
        </h2>

        <p class="text-center text-gray-200 mb-8">
            Login to continue reading your favorite blogs.
        </p>

        <div class="space-y-6">

            <div>
                <label class="block text-sm font-medium text-gray-100 mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="yourmail@domain.com"
                    class="w-full rounded-xl bg-white/20 border border-white/20 text-white placeholder-gray-300 px-5 py-3 outline-none transition duration-300 focus:border-cyan-300 focus:ring-2 focus:ring-cyan-300"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-100 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    class="w-full rounded-xl bg-white/20 border border-white/20 text-white placeholder-gray-300 px-5 py-3 outline-none transition duration-300 focus:border-cyan-300 focus:ring-2 focus:ring-cyan-300"
                >
            </div>

            <button
                class="w-full rounded-xl bg-white text-indigo-700 font-semibold py-3 shadow-lg hover:bg-cyan-100 hover:scale-[1.02] transition-all duration-300"
            >
                Sign In
            </button>

        </div>

        <p class="mt-8 text-center text-gray-200">
            Don't have an account?
            <a
                routerLink="/auth/register"
                class="font-semibold text-cyan-300 hover:text-white hover:underline transition"
            >
                Register here
            </a>
        </p>

    </div>

</div>
